name: lychgate

on:
  schedule:
    - cron: "17 3 * * *"   # daily; the committed digest keeps this repo "active"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually merge eligible PRs (otherwise dry-run)"
        type: boolean
        default: false

concurrency:
  group: lychgate
  cancel-in-progress: false

permissions:
  contents: write   # commit ledger.jsonl + digests/ to this control repo only
  issues: write     # digest / failure issues in this control repo only

jobs:
  run:
    # Until the App is configured there is nothing to run — and failing daily
    # would open a failure issue every day.
    if: vars.GK_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by SHA: a supply-chain custodian should not float its own deps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Tests run before any token exists: broken code never gets credentials.
      - run: python -W error::SyntaxWarning -m unittest discover -s tests -t .

      # Downscoped installation token. Even if the App were misconfigured with
      # more, this token cannot administer repos or touch workflows.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GK_APP_CLIENT_ID }}
          private-key: ${{ secrets.GK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
          permission-checks: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Evaluate (and merge when applying)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APPLY: ${{ inputs.apply == true || vars.GK_APPLY == '1' }}
        run: |
          flag=""
          if [ "$APPLY" = "true" ]; then flag="--apply"; fi
          python -m lychgate run $flag --report report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit digest + ledger
        if: always() && hashFiles('report.md') != ''
        run: |
          cp report.md "digests/$(date -u +%G-W%V).md"
          git config user.name "lychgate[bot]"
          git config user.email "lychgate@users.noreply.github.com"
          git add ledger.jsonl digests/
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push

      - name: Weekly digest issue (Mondays, once)
        if: always() && hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%u)" = "1" ] || exit 0
          title="Digest $(date -u +%G-W%V)"
          if gh issue list --state all --search "\"$title\" in:title" --json number --jq length | grep -qx 0; then
            gh issue create --title "$title" --body-file report.md
          fi

      # A custodian that dies silently is the worst failure mode: say so loudly.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --title "lychgate run failed ($(date -u +%F))" \
            --body "The daily run failed and may not have produced a digest: $RUN_URL"
